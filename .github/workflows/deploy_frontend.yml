name: Frontend cicd

on: 
  push:
    paths:
      - "frontend/**"

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v3
        - name: configure aws credentials
          uses: aws-actions/configure-aws-credentials@v1
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-east-1

        - name: login to ecr
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1
        - name: docker build tag and push to AWS ECR
          run: |
            docker build -t --build-arg VITE_API_URL=http://localhost:5000/v1 -t frontend:v1 ./frontend
            docker tag frontend:v1 123456789012.dkr.ecr.us-east-1.amazonaws.com/frontend:v1
            docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/frontend:v1
        
        - name: deploy to AWS EC2 instance
          uses: appleboy/ssh-action@master
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              cd /home/ubuntu/frontend
              docker image prune -f
              docker compose down || true
              docker compose pull 
              docker compose up -d
