name: Backend cicd
on:
  push:
    branches:
      - test
    # paths:
    #   - "backend/**"

jobs: 
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1


    - name: docker build tag and push to AWS ECR
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 783490811281.dkr.ecr.us-east-1.amazonaws.com
        docker build -t backend:v1 ./backend
        docker tag backend:v1 783490811281.dkr.ecr.us-east-1.amazonaws.com/backend:v1
        docker push 783490811281.dkr.ecr.us-east-1.amazonaws.com/backend:v1

    - name: Deploy to EC2 using SSM
      run: |
        aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
          "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 783490811281.dkr.ecr.us-east-1.amazonaws.com",
          "cd /var/snap/amazon-ssm-agent/13009/backend",
          "docker compose down || true",
          "docker compose pull",
          "docker compose up -d"
          ]' \
          --region us-east-1