name: Backend cicd
on:
  push:
     paths:
       - "backend/**"

jobs: 
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1


    - name: docker build tag and push to AWS ECR
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 783490811281.dkr.ecr.us-east-1.amazonaws.com
        docker build -t backend ./backend
        docker tag backend 783490811281.dkr.ecr.us-east-1.amazonaws.com/3tier-app-repo:backend-v1
        docker push 783490811281.dkr.ecr.us-east-1.amazonaws.com/3tier-app-repo:backend-v1

    - name: Deploy to EC2 using SSM
      run: |
        aws ssm send-command \
        --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
        --document-name "AWS-RunShellScript" \
        --parameters '{
          "commands":[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 783490811281.dkr.ecr.us-east-1.amazonaws.com",
            "docker prune -f",
            "docker stop backend || true",
            "docker rm -f backend || true",
            "docker pull 783490811281.dkr.ecr.us-east-1.amazonaws.com/3tier-app-repo:backend-v1",
            "docker run -d --env-file .env -p 5000:5000 --name backend 783490811281.dkr.ecr.us-east-1.amazonaws.com/3tier-app-repo:backend-v1"
          ]
        }' \
        --region us-east-1